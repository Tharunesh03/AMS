[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "visual-forensic-ai"
version = "0.1.0"
description = "Visual Forensic AI - supervised REAL vs AI-GENERATED image analysis with measured evidence, Grad-CAM saliency, optional generator fingerprinting and an analytical face module"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "numpy>=1.26",
  "pillow>=10.2",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "torch>=2.2",
  "torchvision>=0.17",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pandas>=2.2",
  "matplotlib>=3.8",
]

[project.optional-dependencies]
serve = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "python-multipart>=0.0.9", "opencv-python-headless>=4.9"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
vfa = "vfa.cli:main"

[tool.setuptools.packages.find]
include = ["vfa*", "app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning", "ignore::UserWarning"]
