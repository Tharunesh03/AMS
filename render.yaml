# Free-tier deploy (Render). The app loads models/ from the repo - no build-time training.
services:
  - type: web
    name: vfa-ai-detector
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.server:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.11"
      - key: OMP_NUM_THREADS
        value: "2"
      - key: VFA_MAX_UPLOAD_BYTES
        value: "8388608"
